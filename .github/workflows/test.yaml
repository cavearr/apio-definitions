name: test

# Measurement branch: verible-verilog-format of apio 1.7 (tools-verible
# 2026-09-20) on small CRLF and LF files, with apio's flags, on each OS.

on:
  push:

defaults:
  run:
    shell: bash

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86-64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Get verible
        run: |
          curl -sSfL -o verible.tgz https://github.com/FPGAwars/tools-verible/releases/download/2026-09-20/apio-verible-${{ matrix.platform }}-20260920.tgz
          mkdir verible
          tar -xzf verible.tgz -C verible
          verible/bin/verible-verilog-format --version

      - name: Format the test files
        run: |
          for f in repro/*.v; do
            cp "$f" t.v
            echo "== $f: $(od -An -c "$f" | tr -s ' ' | tr -d '\n')"
            rc=0
            verible/bin/verible-verilog-format --nofailsafe_success --inplace t.v > out.txt 2>&1 || rc=$?
            echo "RESULT $f rc=$rc"
            head -1 out.txt
            echo "after: $(od -An -c t.v | tr -s ' ' | tr -d '\n')"
          done
